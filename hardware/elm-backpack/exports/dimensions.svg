xt x="195" y="948" font-size="13" fill="#253e4c" font-weight="normal">2.4 walls and floor; floor is 1.4 locally under 1 mm mounting straps. Lid field: 2.0 minimum.</text><line x1="52" y1="984" x2="1148" y2="984" stroke="#c6d3d9"/><text x="52" y="1015" font-size="13" fill="#253e4c" font-weight="normal">Print 1 base + 1 lid + 4 keepers. Lid fastens from below with M3 × 25 screws; top has no fasteners.</text><text x="52" y="1041" font-size="13" fill="#6c7f88" font-weight="normal">Rear USB roof requires local removable support. Board dimensions and available vehicle space need a physical check.</text></svg>